aid: aspiration
name: GreenFi
description: 'GreenFi is a climate-focused consumer financial technology company — the
  rebranded continuation of Aspiration''s consumer banking arm. It offers a combined
  checking and savings account, high-yield savings with goal-based "Savings Pods",
  a debit card, a GreenFi Plus subscription tier, investing through its Redwood fund,
  and a cash-back Marketplace of sustainable brands, alongside impact programs such
  as Plant Your Change, tree planting and carbon offsetting. GreenFi is a financial
  technology company, not a bank; banking services and the debit card are provided
  by Coastal Community Bank, Member FDIC. Aspiration spun its consumer unit out in
  2024 to Mission Financial Partners, LLC, which rebranded it GreenFi in April 2025;
  Coastal Financial Corporation acquired the GreenFi brand in January 2026. It is a
  separate company from Aspiration Partners, Inc., the enterprise carbon business
  that entered Chapter 11. GreenFi ships iOS, Android and web applications to end
  users and publishes no public developer program, API reference, or machine-readable
  specification.'
